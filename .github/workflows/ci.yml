name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Enforces the branch flow of rule G8. Keep this job.
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch flow
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request, nothing to check."
            exit 0
          fi
          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              develop|hotfix/*) ;;
              *) echo "::error::Pull requests into main must come from develop or hotfix/*. Target develop instead."; exit 1 ;;
            esac
          fi
          case "$HEAD" in
            develop|feat/*|fix/*|chore/*|docs/*|test/*|refactor/*|ci/*|hotfix/*|dependabot/*) ;;
            *) echo "::error::Branch '$HEAD' does not follow the naming rule (feat/, fix/, chore/, docs/, test/, refactor/, ci/, hotfix/)."; exit 1 ;;
          esac

  # Which services does this change touch? (AGENTS.md section 6, rule 4)
  # A change outside services/ml and services/data is a root change and runs both.
  # Pushes to develop and main always run both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          ml=true; data=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE...HEAD")
            echo "$files"
            if ! echo "$files" | grep -qvE '^services/(ml|data)/'; then
              echo "$files" | grep -q '^services/ml/' || ml=false
              echo "$files" | grep -q '^services/data/' || data=false
            fi
          fi
          echo "ml=$ml" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv==0.13.5
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make audit
      - run: docker build -t ml-service:ci .
      - name: The image can load the model code
        run: docker run --rm ml-service:ci python -c "import agrofarm_ml.model, agrofarm_ml.scenario"
      - name: Trivy image scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ml-service:ci

  data:
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv==0.13.5
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make audit
      - run: docker build -t data-service:ci .
      - name: The image can run the CLI
        run: docker run --rm data-service:ci --version
      - name: The image can read GeoTIFF files
        run: >-
          docker run --rm --entrypoint python data-service:ci
          -c "import rasterio, agrofarm_data.connector, agrofarm_data.manifest, agrofarm_data.raw_store,
          agrofarm_data.connectors.enso, agrofarm_data.connectors.insivumeh,
          agrofarm_data.connectors.meteomatics,
          agrofarm_data.connectors.nasa_power, agrofarm_data.connectors.planetary_computer,
          agrofarm_data.connectors.soilgrids,
          agrofarm_data.connectors.worldcover, agrofarm_data.terrain.pipeline;
          agrofarm_data.manifest.load_schema()"
      - name: Trivy image scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 data-service:ci

  # The single required status check (rule G3). Keep the job name stable.
  # Add every new job to `needs`. A skipped job counts as passed, so path
  # filters (rule G3.1) never block or bypass this gate.
  ci-gate:
    if: always()
    needs: [policy, changes, ml, data]
    runs-on: ubuntu-latest
    steps:
      - name: Check results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'."; exit 1 ;;
            esac
          done
